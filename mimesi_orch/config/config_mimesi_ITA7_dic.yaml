assimilation:
  ass_var: NO2
  case_dir: ITA7
  emi_perturbations:
    'NO': NO_2000
    NO2: NO2_2000
  model_type: CHIMERE
  no_mems: 12
  obs_type: SAT_NO2_TROPOMI
  run_assimilation_flag: true
  state_variable_qty: QTY_NO2
cleanup:
  delete_out_after_trim: true
  delete_window_emissions: true
  delete_window_ibc: true
  delete_window_meteo: true
  enabled: true
  keep_daily_first_hour_end: true
  keep_daily_last_hour_end: true
  keep_end_vars:
  - lon
  - lat
  - Times
  - 'NO'
  - NO2
  - SO2
  - CO
  - PM10
  - PM25
  - O3
  keep_out_vars:
  - lon
  - lat
  - Times
  - 'NO'
  - NO2
  - SO2
  - CO
  - PM10
  - PM25
  - O3
  - tem2
  - u10m
  - v10m
  - w10m
  retain_cycles: 20
  retention_interval_cycles: 3
  trim_end: true
  trim_out: true
cluster:
  cluster_queue: g100_usr_prod
  project_name: mimesi
  scheduler: SLURM
dart:
  analysis_dir: RUN/data_freerun/analysis
  obs_converters_dir: DART/observations/obs_converters/S5P_TROPOMI_L3
  posteriors_dir: RUN/data_freerun/posteriors
  preassim_dir: RUN/data_freerun/preassim
  work_dir: DART/models/FARM/work_freerun
logging:
  format: '%(asctime)s [%(processName)s/%(threadName)s] %(levelname)s: %(message)s'
  level: INFO
paths:
  base_path: /g100_work/ARPAE_AQM/MIMESI/
  chimere_input_atm_dir: /g100_work/ARPAE_AQM/MIMESI/runs_chimere/input_testcase_2025/ATM
  chimere_input_emissions_dir: /g100_work/ARPAE_AQM/MIMESI/runs_chimere/input_testcase_2025/emissioni
  chimere_input_ibc_dir: /g100_work/ARPAE_AQM/MIMESI/runs_chimere/input_testcase_2025/IBC
  chimere_par_template: catena_aria_test/Chimere/auto_runs/templates/chimere.mimesi-ITA7_template.par
  env_python: miniconda3/bin/python3.13
  listing_file: SAT_OBS/C03__listing.csv
  log_directory: logs_orchestrator
  path_data: /g100_scratch/userexternal/lbressan/ITA7
  path_filter: DART/models/CHIMERE_v2017r/work_offline
  path_perturbed_emi: perturbations/emi_mems
  path_submit_bsh: catena_aria_test/Chimere/auto_runs
  run_submit_model_template: catena_aria_test/Chimere/auto_runs/templates/run_mimesi-ITA7_template.sh
  run_submit_replace_perturbations: DART/mimesi_orch/perturbation/bash_emissions/submit_replace_perturb_into_original_emission_arg.sh
satellite_data:
  search_window_seconds: 1800
time:
  backup_ic_hours: 48
  backup_ic_option: hourly
  backup_perturb_days: 2
  dt_seconds: 3600
  end_time: '2025-12-02 00:00:00'
  start_time: '2025-12-01 01:00:00'
